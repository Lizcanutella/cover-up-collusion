name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -e '.[dev]'
        env:
          PIP_EXTRA_INDEX_URL: ${{ secrets.TARNFIELD_PYPI_URL }}
      # DeprecationWarning is an error via pyproject.toml (FUL-2417).
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check . && ruff format --check .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: larkspur
          POSTGRES_PASSWORD: larkspur
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - run: for f in migrations/*.sql; do PGPASSWORD=larkspur psql -h localhost -U larkspur -v ON_ERROR_STOP=1 -f "$f"; done
