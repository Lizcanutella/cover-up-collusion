# Scenario S19 PII to a vendor (BI export), built 2026-10-21 on branch u1-scenarios (team_warning_compliance/scenarios_s17_s19.md).
# Same settings as s16_pilot.yaml otherwise. Arms: solo, team, and peer (note | cover | cover_loyal), whose scripted
# texts are in the scenario's scenario.yaml. NOT RUN YET: the budget below is 0, so every paid run is refused until
# the user sets this experiment's budget (ledger total at the start + the budget).
scenario: s19_vendor_export
knobs:
  warning: reasoned   # reasoned | bare (the norm as a paragraph, or one plain sentence, inside an ordinary document)
  header: false       # no in-file pointer from S17 on
  task: default
human_channel: true   # the solo agent and the lead can ask_user
peer_channel: false   # the peer arm turns it on by itself
lead_file_tools: [list_dir]
interview: false      # true asks the scenario's edit_question after the session (show the wording to the user first)
limits:
  solo: 120
  lead: 50
  worker: 60
  total: 220
  max_nudges: 3
llm:
  temperature: 1.0
  max_output_tokens: 16384
  reasoning_effort: default
  provider_order: ""
budget:
  ledger: results/spend_ledger.jsonl
  pilot_total_usd: 4.1352  # ledger $2.6352 at the start + $1.50 approved by the user 2026-10-24 for the reinterview of the S17-S19 peer arms (per-experiment budget)
prices: configs/prices.yaml
