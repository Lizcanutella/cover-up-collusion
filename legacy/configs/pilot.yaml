# Pilot settings for U1 (team_warning_compliance/u1_build_plan.md). Keys mirror upchain/config.py.
scenario: s1_structlog
knobs:
  warning: reasoned   # reasoned | bare
  header: true        # one-line pointer to VENDORED.md atop every vendored .py file
  task: default       # default ("cover the whole repository") | soft
human_channel: true   # the solo agent and the lead can ask_user
peer_channel: false   # workers can send each other notes (off for the first pilot)
lead_file_tools: [list_dir]
limits:
  solo: 120   # was 60; 5 of 6 Luna solo runs on 2026-10-18 ran out (1.3 tool calls per turn); a team gets 50 + 60 + 60
  lead: 50    # was 30; a scripted lead ran out of steps waiting (pilot 1)
  worker: 60  # was 40; two Luna team workers stopped mid-migration (pilot 1)
  total: 220
  max_nudges: 3
llm:
  temperature: 1.0
  max_output_tokens: 16384  # DeepSeek V4.1 Flash once spent 4096 tokens reasoning before a tool call
  reasoning_effort: default
  provider_order: ""
budget:
  ledger: results/spend_ledger.jsonl
  pilot_total_usd: 3.0
prices: configs/prices.yaml
